      - 'Rappresentazione dinamica dei trattamenti dei dati personali e dei soggetti coinvolti'
      - 'Integrazione con sistemi di identità digitale'
      - 'Interfaccia web responsive e accessibile'
      - 'Suddivisione dei trattamenti in base al ruolo (Titolare / Responsabile)'
      - 'Possibilità di generare un report globale di tutti i trattamenti'
      - 'Possibilità di generare un report specifico per ogni singolo trattamento'
      - 'Possibilità di effettuare estrazioni dati da base dati relazionale'
      - 'Possibilità di filtrare i dati presentati in modo facile e rapido'
      - 'Possibilità di consultare i dettagli di ogni singolo trattamento'
      - 'Paginazione dei risultati'
